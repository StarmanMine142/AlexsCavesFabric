import java.nio.file.AtomicMoveNotSupportedException
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = 'com.github.alexscaves'

repositories {
    mavenLocal()
    maven {
        name = "Fabric"
        url = "https://maven.fabricmc.net/"
    }
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "CurseMaven"
        url = "https://www.cursemaven.com"
    }
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev"
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
    maven {
        name = "Shedaniel Maven"
        url = "https://maven.shedaniel.me/"
    }
}

base {
    archivesName = 'alexscaves'
}

def prismModsDirPath = providers.gradleProperty('prismModsDir')
    .orElse(providers.environmentVariable('PRISM_MODS_DIR'))

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

loom {
    accessWidenerPath = file('src/main/resources/alexscaves.accesswidener')
    mixin {
        defaultRefmapName = 'alexscaves.refmap.json'
    }
}

sourceSets {
    main {
        resources { srcDir 'src/generated/resources' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()

    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    compileOnly "com.google.code.findbugs:jsr305:3.0.2"

    modCompileOnlyApi "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"

    modCompileOnly "maven.modrinth:mezzconfig:Q5Yns1Qe"
    modCompileOnly "maven.modrinth:mezzconfiggui:j744Bkpz"

    modCompileOnlyApi "me.shedaniel:RoughlyEnoughItems-api-fabric:${rei_version}"
    modImplementation "me.shedaniel:RoughlyEnoughItems-fabric:${rei_version}"

    modImplementation "me.shedaniel.cloth:cloth-config-fabric:${cloth_config_version}"

    modImplementation "maven.modrinth:modmenu:11.0.5"

    // Citadel remains vendored in-tree on this branch.
    // Add an external dependency only once the port fully switches over.
    // compileOnly "group:artifact:${citadel_version}"
}

tasks.processResources {
    var replaceProperties = [
        minecraft_version    : minecraft_version,
        fabric_loader_version: fabric_loader_version,
        fabric_api_version   : fabric_api_version,
        mod_id               : mod_id,
        mod_name             : mod_name,
        mod_license          : mod_license,
        mod_version          : mod_version,
        mod_authors          : mod_authors,
        mod_description      : mod_description
    ]

    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

jar {
    manifest {
        attributes([
            'Specification-Title'    : project.mod_id,
            'Specification-Vendor'   : mod_authors,
            'Specification-Version'  : '1',
            'Implementation-Title'   : project.name,
            'Implementation-Version' : project.jar.archiveVersion,
            'Implementation-Vendor'  : mod_authors
        ])
    }
}

tasks.register('deployToPrismMods') {
    onlyIf {
        prismModsDirPath.present && !prismModsDirPath.get().isBlank()
    }

    doLast {
        def source = tasks.named('remapJar').get().archiveFile.get().asFile.toPath()
        def prismModsDir = file(prismModsDirPath.get())
        def targetDir = prismModsDir.toPath()
        def target = targetDir.resolve(source.fileName.toString())
        def temp = targetDir.resolve("${source.fileName}.tmp")

        Files.createDirectories(targetDir)
        Files.copy(source, temp, StandardCopyOption.REPLACE_EXISTING)
        try {
            Files.move(
                temp,
                target,
                StandardCopyOption.REPLACE_EXISTING,
                StandardCopyOption.ATOMIC_MOVE
            )
        } catch (AtomicMoveNotSupportedException ignored) {
            Files.move(temp, target, StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

tasks.named('remapJar') {
    finalizedBy tasks.named('deployToPrismMods')
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file:///${project.projectDir}/mcmodsrepo"
        }
    }
}
